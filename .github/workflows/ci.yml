name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm --prefix client ci
      - name: Fresh migration and replay
        env:
          DATABASE_PATH: ${{ runner.temp }}/ledger.db
        run: |
          npm run migrate
          npm run migrate
          npm run migrate:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=low
      - run: npm --prefix client audit --audit-level=low
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag governed-ledger:${{ github.sha }} .
