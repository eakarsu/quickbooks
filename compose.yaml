services:
  ledger:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5010
      DATABASE_PATH: /var/lib/quickbooks/cashflow.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      BROKER_ACME_WEBHOOK_SECRET: ${BROKER_ACME_WEBHOOK_SECRET:-}
    volumes:
      - ledger-data:/var/lib/quickbooks
    ports:
      - "127.0.0.1:${HOST_PORT:-5010}:5010"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5010/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ledger-data:
